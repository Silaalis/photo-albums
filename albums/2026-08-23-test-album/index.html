<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Album</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css">
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:20px 16px 40px; background:#111; color:#eee;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:1.25rem; font-weight:600; margin:0 0 4px; }
  .meta { color:#999; font-size:.85rem; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px; }
  .grid a { display:block; aspect-ratio:1/1; overflow:hidden; border-radius:8px; background:#222; }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; }
  a.back { color:#7ab8ff; text-decoration:none; font-size:.9rem; }
</style>
</head>
<body>
<p><a class="back" href="../../index.html">&larr; All albums</a></p>
<h1>Test Album</h1>
<p class="meta">3 photos</p>
<div class="grid" id="gallery">
  <a href="full/001.jpg" data-pswp-width="1600" data-pswp-height="1200"><img src="thumbs/001.jpg" loading="lazy" alt=""></a>
  <a href="full/002.jpg" data-pswp-width="1600" data-pswp-height="1200"><img src="thumbs/002.jpg" loading="lazy" alt=""></a>
  <a href="full/003.jpg" data-pswp-width="1600" data-pswp-height="1200"><img src="thumbs/003.jpg" loading="lazy" alt=""></a>
</div>
<script type="module">
  import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.js';
  const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: 'a',
    pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.js')
  });
  lightbox.init();
</script>
</body>
</html>
