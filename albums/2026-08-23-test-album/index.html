<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Album</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0b0d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:5; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .topbar a { color:rgba(255,255,255,.6); text-decoration:none; font-size:.8rem; pointer-events:auto; }
  .counter { color:rgba(255,255,255,.6); font-size:.8rem; }
  .stage { height:100%; display:flex; align-items:center; justify-content:center; padding:44px 10px 26px; }
  #book { width:min(92vw, 460px); height:min(78vh, 640px); }
  .page { background:#1c1c1f; overflow:hidden; }
  .page-content { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    position:relative; background:#000; }
  .page-content img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .pagenum { position:absolute; bottom:8px; right:12px; color:rgba(255,255,255,.55);
    font-size:.72rem; letter-spacing:.04em; }
  .cover { width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:32px 22px; position:relative;
    background:linear-gradient(160deg,#2b2320,#141210 65%); color:#f1e9de;
    border:1px solid rgba(255,255,255,.06); overflow:hidden; }
  .cover::before { content:""; position:absolute; inset:10px; border:1px solid rgba(230,200,150,.28); pointer-events:none; z-index:3; }
  .cover-photo { position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:.22; filter:blur(1px) saturate(.7); }
  .cover h1 { position:relative; font-family:Georgia,"Times New Roman",serif; font-weight:600;
    font-size:1.6rem; line-height:1.3; margin:0 0 10px; letter-spacing:.01em; }
  .cover .sub { position:relative; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase;
    color:#c9b48a; margin:0; }
  .cover .hint { position:relative; margin-top:26px; font-size:.78rem; color:rgba(241,233,222,.65); }
  .cover-bg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    object-position:center center; }
  .patch { position:absolute; left:0; top:0; width:0; height:0; filter:blur(3px); z-index:1; }
  .title-on-patch { position:absolute; left:0; top:0; width:0; height:0; z-index:2; display:flex;
    align-items:center; justify-content:center; overflow:hidden;
    font-family:Georgia,"Times New Roman",serif; font-weight:700; color:#e7cd97;
    text-shadow:0 1px 0 rgba(255,255,255,.15), 0 -1px 1px rgba(0,0,0,.6);
    letter-spacing:.02em; line-height:1.05; padding:2%; text-align:center; }
  .hint-pill { position:absolute; z-index:2; bottom:4%; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#f1e9de; font-size:.72rem; padding:6px 14px;
    border-radius:20px; white-space:nowrap; }
  .backcover { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#2b2320,#141210 65%); color:rgba(241,233,222,.5);
    font-family:Georgia,"Times New Roman",serif; font-size:.95rem; letter-spacing:.06em; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../../index.html">&larr; All albums</a>
  <span class="counter" id="counter"></span>
</div>
<div class="stage">
  <div id="book">
    <div class="page" data-density="hard">
      <div class="cover">
        <img class="cover-bg-img" id="coverImg" src="cover-bg.jpg" data-iw="686" data-ih="616" alt="">
        <div class="patch" data-box="0.2697,0.1591,0.8746,0.2597" style="background:linear-gradient(135deg, rgb(103,75,61), rgb(65,38,21))"></div>
        <div class="title-on-patch" data-box="0.2697,0.1591,0.8746,0.2597">Test Album</div>
        <div class="hint-pill">Tap or swipe to open &rarr;</div>
      </div>
    </div>
    <div class="page" data-density="soft"><div class="page-content"><img src="full/001.jpg" loading="lazy" alt=""><span class="pagenum">1 / 3</span></div></div>
    <div class="page" data-density="soft"><div class="page-content"><img src="full/002.jpg" loading="lazy" alt=""><span class="pagenum">2 / 3</span></div></div>
    <div class="page" data-density="soft"><div class="page-content"><img src="full/003.jpg" loading="lazy" alt=""><span class="pagenum">3 / 3</span></div></div>
    <div class="page" data-density="hard">
      <div class="backcover">Test Album</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
  const bookEl = document.getElementById('book');
  const pageFlip = new St.PageFlip(bookEl, {
    width: 400,
    height: 560,
    size: 'stretch',
    minWidth: 260,
    maxWidth: 700,
    minHeight: 360,
    maxHeight: 980,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.5,
    mobileScrollSupport: false,
    flippingTime: 700
  });
  pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

  const counter = document.getElementById('counter');
  const totalPages = pageFlip.getPageCount();
  function updateCounter(e) {
    counter.textContent = (e.data + 1) + ' / ' + totalPages;
  }
  updateCounter({ data: 0 });
  pageFlip.on('flip', updateCounter);

  // Position the cover's title/patch overlays to match wherever the cover image
  // actually rendered under object-fit:contain (which letterboxes rather than crops
  // -- replicated here in JS since CSS can't expose contain's computed box to
  // sibling elements). Re-run on load/resize/orientation change so it stays correct
  // as the flip-book's own 'stretch' sizing responds to the viewport.
  function layoutCover() {
    const coverEl = document.querySelector('.cover');
    const img = document.getElementById('coverImg');
    if (!coverEl || !img) return;
    const cw = coverEl.clientWidth, ch = coverEl.clientHeight;
    const iw = parseFloat(img.dataset.iw), ih = parseFloat(img.dataset.ih);
    if (!cw || !ch || !iw || !ih) return;
    const containerRatio = cw / ch, imgRatio = iw / ih;
    let rw, rh;
    if (imgRatio > containerRatio) { rw = cw; rh = cw / imgRatio; }
    else { rh = ch; rw = ch * imgRatio; }
    const ox = (cw - rw) / 2, oy = (ch - rh) / 2;
    coverEl.querySelectorAll('[data-box]').forEach(function (el) {
      const parts = el.dataset.box.split(',').map(Number);
      const x0 = parts[0], y0 = parts[1], x1 = parts[2], y1 = parts[3];
      const bw = (x1 - x0) * rw, bh = (y1 - y0) * rh;
      el.style.left = (ox + x0 * rw) + 'px';
      el.style.top = (oy + y0 * rh) + 'px';
      el.style.width = bw + 'px';
      el.style.height = bh + 'px';
      if (el.classList.contains('title-on-patch')) {
        el.style.fontSize = Math.max(11, bh * 0.6) + 'px';
      }
    });
  }
  window.addEventListener('load', layoutCover);
  window.addEventListener('resize', layoutCover);
  pageFlip.on('changeOrientation', layoutCover);
  setTimeout(layoutCover, 0);
  setTimeout(layoutCover, 300);
</script>
</body>
</html>
